name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; jobs opt in to more.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[lint,test]"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .
      - name: mypy (strict)
        run: mypy

  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # The default install must work everywhere with no compiler and no
      # backend. This is the install-quality commitment, tested rather than
      # asserted.
      #
      # Genuinely bare first, before anything test-only lands: the default
      # closure is empty, numpy included (DEPENDENCIES.md) only in named
      # extras, so `import akriti`
      # has to work with nothing else installed at all. Doing this after
      # `.[test]` would prove nothing -- that extra carries numpy, and the
      # step would pass on an install that is not the one users get.
      - name: Install (default closure only)
        run: pip install -e .

      - name: Import on a bare install
        run: python -c "import akriti, akriti.diagrams; print(akriti.__version__)"

      - name: Install test dependencies
        run: pip install -e ".[test]"

      - name: Test (no backend)
        run: pytest -m "not backend"

  optional:
    name: optional / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rips
            extra: rips
            marker: rips
            imports: import ripser
          - name: alpha
            extra: alpha
            marker: alpha
            imports: import gudhi
          - name: distances
            extra: distances
            marker: distances
            imports: import persim
          - name: cross
            extra: rips,alpha
            marker: cross_backend
            imports: import ripser, gudhi
          - name: torch
            extra: torch
            marker: torch
            imports: import torch, array_api_compat
          - name: parquet
            extra: parquet
            marker: parquet
            imports: import pyarrow
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install isolated optional row
        run: pip install -e ".[test,${{ matrix.extra }}]"
      - name: Verify installed optional imports
        run: python -c "${{ matrix.imports }}"
      - name: Test selected optional path
        run: pytest -m "${{ matrix.marker }}"
      # Torch's wheel closure is intentionally report-only: it is large and
      # may contain transitive packages whose licence metadata is not suitable
      # for the strict default/io/parquet gates. This reuses the row's install.
      - name: Audit torch closure (report only)
        if: matrix.name == 'torch'
        run: python tools/check_license_closure.py --profile torch --allow-copyleft

  closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Deliberately a clean venv containing the DEFAULT install and nothing
      # else. Checking the dev environment would pass trivially and prove
      # nothing. See DEPENDENCIES.md.
      - name: Build default-install environment
        run: |
          python -m venv .venv-closure
          .venv-closure/bin/pip install --quiet .

      - name: Enforce permissive-only default closure
        run: .venv-closure/bin/python tools/check_license_closure.py

      # akriti[io] is the one user-facing extra that is expected to stay
      # permissive: it resolves to akriti[numpy], and numpy is BSD-3-Clause.
      # Enforced strictly rather than audited, so that a future change adding
      # a copyleft dependency to serialization fails here instead of being
      # reported into a log nobody reads. Runs before the copyleft extras go
      # into this venv, since afterwards it could not pass.
      - name: Enforce permissive-only akriti[io] closure
        run: |
          .venv-closure/bin/pip install --quiet ".[io]"
          .venv-closure/bin/python tools/check_license_closure.py --profile io

      # Keep Parquet strict in its own clean environment. The isolated venv
      # prevents cumulative contamination from any unrelated optional path.
      - name: Enforce permissive-only akriti[parquet] closure
        run: |
          python -m venv .venv-parquet-closure
          .venv-parquet-closure/bin/pip install --quiet ".[parquet]"
          .venv-parquet-closure/bin/python tools/check_license_closure.py \
            --profile parquet

      # Extras are expected to contain copyleft; report so a change is visible
      # in the log, but do not fail on it.
      - name: Audit extras (report only)
        run: |
          .venv-closure/bin/pip install --quiet ".[rips,alpha,distances]"
          .venv-closure/bin/python tools/check_license_closure.py \
            --profile extras --allow-copyleft

  rfc-evidence:
    name: RFC-0001 evidence still reproduces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # RFC-0001 makes specific claims about backend behaviour. If a backend
      # release changes one of them, we want to find out from CI rather than
      # from a reviewer.
      - run: pip install -e ".[rips,alpha,distances]" scikit-learn giotto-tda
        continue-on-error: true
      - name: Reproduce appendix measurements
        continue-on-error: true
        run: python rfcs/evidence/probe_backends.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
