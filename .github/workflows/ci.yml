name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; jobs opt in to more.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[lint,test]"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .
      - name: mypy (strict)
        run: mypy

  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # The default install must work everywhere with no compiler and no
      # backend. This is the install-quality commitment, tested rather than
      # asserted.
      #
      # Genuinely bare first, before anything test-only lands: the default
      # closure is empty, numpy included (DEPENDENCIES.md) only in named
      # extras, so `import akriti`
      # has to work with nothing else installed at all. Doing this after
      # `.[test]` would prove nothing -- that extra carries numpy, and the
      # step would pass on an install that is not the one users get.
      - name: Install (default closure only)
        run: pip install -e .

      - name: Import on a bare install
        run: python -c "import akriti, akriti.diagrams; print(akriti.__version__)"

      - name: Install test dependencies
        run: pip install -e ".[test]"

      - name: Test (no backend)
        run: pytest -m "not backend"

  optional:
    name: optional / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rips
            extra: rips
            marker: rips
            imports: import ripser
          - name: alpha
            extra: alpha
            marker: alpha
            imports: import gudhi, gudhi.sklearn.rips_persistence
          - name: distances
            extra: distances
            marker: distances
            imports: import persim
          - name: cross
            extra: rips,alpha
            marker: cross_backend
            imports: import ripser, gudhi
          - name: torch
            extra: torch
            marker: torch
            imports: import torch, array_api_compat
          # RFC-0001 §3.3 requires D23's 64-bit constraint to be *exercised*
          # rather than asserted -- "a support claim no test runs is a claim
          # that rots silently" (§9). `test_rfc0001_jax_live.py` has existed
          # since the review pass, but until this row nothing installed JAX, so
          # the `jax` marker selected a module that always skipped and the
          # claim was never checked anywhere. The row is what makes N3.3-15
          # real. Note it also carries `backend`, so `-m jax` is the selector
          # that isolates it.
          - name: jax
            extra: jax
            marker: jax
            imports: import jax
          - name: parquet
            extra: parquet
            marker: parquet
            imports: import pyarrow
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install isolated optional row
        run: pip install -e ".[test,${{ matrix.extra }}]"
      # `gudhi.sklearn.*` is the interface D20 rests on, and `pip install
      # gudhi` does not pull scikit-learn -- the wheel imports it lazily, so
      # the dependency is real but undeclared upstream. Installed here rather
      # than added to the `alpha` extra, which is a user-facing install and
      # must not grow a dependency only the test suite needs.
      #
      # `test_live_gudhi_sklearn_position_is_not_the_degree` is a measurement,
      # not a nicety: it is what establishes that a block's list position is an
      # index into the caller's `homology_dimensions` rather than the
      # homological degree. Left uninstalled, that test raises
      # ModuleNotFoundError rather than skipping, which is how this was found.
      # An `importorskip` here would be the wrong repair for the same reason
      # `--require-giotto` exists below: a measurement that quietly does not
      # run is worse than one that fails.
      - name: Install scikit-learn for GUDHI's sklearn interface
        if: matrix.name == 'alpha'
        run: pip install "scikit-learn>=1.8"
      - name: Verify installed optional imports
        run: python -c "${{ matrix.imports }}"
      - name: Test selected optional path
        run: pytest -m "${{ matrix.marker }}"
      # The torch and jax wheel closures are intentionally report-only: both are
      # large, platform-specific binary wheels that may contain transitive
      # packages whose licence metadata is not suitable for the strict
      # default/io/parquet gates. This reuses the row's install rather than
      # making a second multi-gigabyte one. The profile name is the row name in
      # both cases, so this stays one step rather than two that can drift.
      - name: Audit ${{ matrix.name }} closure (report only)
        if: matrix.name == 'torch' || matrix.name == 'jax'
        run: |
          python tools/check_license_closure.py \
            --profile ${{ matrix.name }} --allow-copyleft

  closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Deliberately a clean venv containing the DEFAULT install and nothing
      # else. Checking the dev environment would pass trivially and prove
      # nothing. See DEPENDENCIES.md.
      - name: Build default-install environment
        run: |
          python -m venv .venv-closure
          .venv-closure/bin/pip install --quiet .

      - name: Enforce permissive-only default closure
        run: .venv-closure/bin/python tools/check_license_closure.py

      # akriti[io] is the one user-facing extra that is expected to stay
      # permissive: it resolves to akriti[numpy], and numpy is BSD-3-Clause.
      # Enforced strictly rather than audited, so that a future change adding
      # a copyleft dependency to serialization fails here instead of being
      # reported into a log nobody reads. Runs before the copyleft extras go
      # into this venv, since afterwards it could not pass.
      - name: Enforce permissive-only akriti[io] closure
        run: |
          .venv-closure/bin/pip install --quiet ".[io]"
          .venv-closure/bin/python tools/check_license_closure.py --profile io

      # Keep Parquet strict in its own clean environment. The isolated venv
      # prevents cumulative contamination from any unrelated optional path.
      - name: Enforce permissive-only akriti[parquet] closure
        run: |
          python -m venv .venv-parquet-closure
          .venv-parquet-closure/bin/pip install --quiet ".[parquet]"
          .venv-parquet-closure/bin/python tools/check_license_closure.py \
            --profile parquet

      # Extras are expected to contain copyleft; report so a change is visible
      # in the log, but do not fail on it.
      - name: Audit extras (report only)
        run: |
          .venv-closure/bin/pip install --quiet ".[rips,alpha,distances]"
          .venv-closure/bin/python tools/check_license_closure.py \
            --profile extras --allow-copyleft

  rfc-evidence:
    name: RFC-0001 evidence still reproduces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # 3.12 is load-bearing here, not inherited: giotto-tda 0.6.2 and
          # every runtime dependency installed below ship cp312 manylinux
          # wheels, and Appendix A.1-A.4 were themselves measured on Python
          # 3.12.11 with giotto-tda 0.6.2 installed -- see the header of
          # rfcs/evidence/probe_backends.py. Moving this job off 3.12 moves it
          # off the environment the appendix records.
          python-version: "3.12"
          cache: pip

      # RFC-0001 makes specific claims about backend behaviour. If a backend
      # release changes one of them, we want to find out from CI rather than
      # from a reviewer. That includes giotto's own rows -- A.1 (giotto drops
      # the essential class under every setting) and A.5 (the coefficient
      # field lives on the estimator, not on the returned array) -- which is
      # why `--require-giotto` is passed: it fails the job if giotto is merely
      # unimportable and therefore silently unmeasured.
      #
      # giotto-tda is installed with `--no-deps`, deliberately. Do not "fix"
      # this back to a plain install. giotto-tda 0.6.2's metadata pins
      # `scikit-learn==1.3.2` exactly, which cannot coexist with akriti's own
      # `numpy>=2.0` floor (D6), so this job simply does not resolve while pip
      # is allowed to read that pin. `--no-deps` takes the wheel and lets its
      # runtime dependencies be supplied at versions that do resolve. 0.6.2 is
      # pinned because that is the version RFC-0001 §9.2 measures.
      #
      # This does not contradict §9.2. §9.2 says giotto-tda unaided does not
      # run on current scikit-learn, and it still does not: what runs here is
      # giotto plus `probe_backends.patch_giotto()`, which translates the
      # `check_array(force_all_finite=)` keyword scikit-learn renamed in 1.6
      # and removed in 1.8. That shim is a local workaround at the public-API
      # boundary, not a fix and not a patch akriti ships -- and it stays in the
      # probe. giotto-tda is AGPLv3 and MUST NOT enter any user-facing extra,
      # so this install lives in this job and nowhere else (pyproject.toml
      # carries the same split next to the `test` extra).
      - name: Install backends and the giotto evidence environment
        run: |
          pip install -e ".[numpy,rips,alpha,distances]" \
            "scikit-learn>=1.8" "scipy>=1.17"
          # giotto-tda 0.6.2's runtime dependencies, minus its scikit-learn pin.
          pip install "giotto-ph>=0.2.4" "pyflagser>=0.4.7" "igraph>=1.0.0" \
            "plotly>=6.9.0" "joblib>=1.5.3"
          # Last, so no later resolve step can drag the pinned sklearn back in.
          pip install --no-deps "giotto-tda==0.6.2"
      - name: Reproduce appendix measurements
        run: python rfcs/evidence/probe_backends.py --require-giotto

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
