# Publish to PyPI on a GitHub release, via Trusted Publishing.
#
# No API token exists anywhere in this repository or its secrets. PyPI is told
# once, on its own site, that this repository's `release.yml` workflow running
# in the `pypi` environment may publish `akriti`; GitHub then mints a
# short-lived OIDC token per run and PyPI verifies it. A leaked repository
# secret cannot publish because there is no secret to leak.
#
# Setup, once, at https://pypi.org/manage/project/akriti/settings/publishing/
#   Owner            akritihq
#   Repository       akriti
#   Workflow         release.yml
#   Environment      pypi
#
# The `pypi` environment should also exist in repository settings, with
# whatever reviewers you want standing between a tag and a publish.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Rebuild from the tagged commit rather than trusting an artifact from
  # another workflow run: what is published must come from what was tagged.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

      # The version in the artifact must match the tag that triggered this.
      # Without it, a mistagged release publishes the wrong version silently,
      # and PyPI will not let it be replaced afterwards.
      - name: Version must match the tag
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.tar.gz | sed -E 's/.*akriti-(.+)\.tar\.gz/\1/')
          echo "tag=$tag built=$built"
          if [ "$tag" != "$built" ]; then
            echo "::error::tag $tag does not match built version $built"
            exit 1
          fi

      # The claim RFC-0001 section 10.1 requirement 2 makes, checked against the
      # artifact that is about to be published rather than the source tree.
      - name: Default install closure must be empty
        run: |
          python -m venv /tmp/closure
          /tmp/closure/bin/pip install --quiet dist/*.whl
          found=$(/tmp/closure/bin/python - <<'PY'
          import importlib.metadata as md
          ignore = {"pip", "setuptools", "wheel", "akriti"}
          print(",".join(sorted(
              d.metadata["Name"] for d in md.distributions()
              if d.metadata["Name"] not in ignore
          )))
          PY
          )
          if [ -n "$found" ]; then
            echo "::error::default install pulled in: $found"
            exit 1
          fi
          /tmp/closure/bin/python -c "from akriti.diagrams import PersistenceDiagram, DiagramBatch"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # mint the OIDC token; nothing else
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
