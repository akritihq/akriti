[build-system]
requires = ["hatchling>=1.31"]
build-backend = "hatchling.build"

[project]
name = "akriti"
version = "0.0.1.dev0"
description = "The statistically grounded entry point to topological data analysis in Python"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Pramita Bagchi" },
    { name = "Sushovan Majhi", email = "s.majhi@email.gwu.edu" },
    { name = "Atish Mitra" },
    { name = "Žiga Virk" },
]
keywords = [
    "topological data analysis", "persistent homology", "persistence diagram",
    "statistics", "hypothesis testing", "topology",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

# ---------------------------------------------------------------------------
# DEFAULT CLOSURE — EMPTY. Not "permissive only": empty. Not even numpy.
#
# This is deliberately smaller than the project's original plan assumed, and the
# reason is measured, not stylistic. See DEPENDENCIES.md for the full audit.
#
#   persim depends on hopcroftkarp, which is GPLv3 and was last released
#   2019-10-11. ripser depends on persim. There is therefore NO arrangement in
#   which `pip install akriti` pulls a persistence backend and keeps an
#   permissive-only closure.
#
# So the backends move behind extras. numpy then went the same way, one step
# later and for a different reason: RFC-0001 §3.3 and §10.1 requirement 2
# require `diagrams/core.py` and `diagrams/adapters.py` to import nothing
# beyond the standard library, operating entirely through
# `__array_namespace__` on whatever array the caller already has. A package
# that *declares* numpy contradicts that however carefully the modules
# themselves are written: it installs numpy for a torch user who will never
# touch it, and it makes "zero third-party dependencies" a claim about import
# statements rather than about what `pip install akriti` actually fetches.
# numpy is needed only inside io.py's save/load for `.npz`, where §3.3
# requires it to be a lazy, function-scoped import.
#
# It does NOT follow that the version floor has nowhere to go. An earlier
# revision of this note concluded that it did, and RFC-0001 D6 reverses it:
# an empty default closure and an undeclared runtime dependency are different
# things. numpy is declared by the `numpy` extra below at the >=2.0 floor D6
# established for main-namespace `__array_namespace__`, so `pip install
# akriti` still fetches nothing while anyone who needs numpy resolves that
# floor at install time. Undeclared, a user on numpy 1.24 gets an
# AttributeError at run time instead of a resolver error at install time,
# because a presence-only lazy import never fires on a version that is merely
# too old -- which is precisely what D6 existed to prevent.
# `tools/check_license_closure.py` enforces the closure in CI.
# ---------------------------------------------------------------------------
dependencies = []

[project.optional-dependencies]
# Vietoris-Rips via Ripser. MIT itself; pulls GPLv3 hopcroftkarp transitively
# through persim, and matplotlib (PSF). Documented at the install boundary.
rips = ["ripser>=0.6.4"]

# GUDHI. Its own code is MIT, but modules depending on CGAL / Miniball / PyKeOps
# are marked "MIT (GPL v3)" upstream, and the PyPI wheel bundles them --
# gudhi.AlphaComplex is importable from a plain `pip install gudhi`. Treat the
# whole wheel as GPLv3-encumbered. https://gudhi.inria.fr/licensing/
alpha = ["gudhi>=3.9"]

# Diagram distances and vectorisations. MIT; GPLv3 hopcroftkarp transitively.
# NOTE: persim returns a finite bottleneck distance between diagrams that are
# infinitely far apart. core/distances.py MUST partition on `essential` before
# delegating -- see RFC-0001 §9.1.
distances = ["persim>=0.3.1"]

# The array namespace, for callers who want one and have no opinion about
# which. `core.py` and `adapters.py` work on whatever the caller brings
# (RFC-0001 §3.3), so this is a convenience rather than a requirement -- but
# it is the convenience nearly every user wants, and it is where the >=2.0
# floor lives: below that, numpy has no main-namespace `__array_namespace__`
# and nothing in `diagrams/` can operate on its arrays at all (D6).
#
# Separate from `io` deliberately. Wanting numpy as your array backend and
# wanting to read and write `.akd` files are different wants, and a user with
# the first should not have to install under the name of the second.
numpy = ["numpy>=2.0"]

# Serialization: `.akd` save/load (RFC-0001 §10). Needs numpy for `.npz`, at
# the same floor and by reference, so there is one place to raise it.
io = ["akriti[numpy]"]

# Tensor backend for the neural-network path. Never a hard dependency: a
# biologist who wants a p-value must not download a multi-gigabyte library.
torch = ["torch>=2.0"]

# Domain integration.
bio = ["anndata>=0.10"]

# giotto-tda is AGPLv3 and MUST NOT enter any user-facing extra. It is present
# for compat-shim fixtures only, and it does not currently run on scikit-learn
# >= 1.8 (RFC-0001 §9.2), so CI uses committed fixture arrays instead.
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.165.2",   # MPL-2.0, weak copyleft. Test-only, never shipped.
    # Conformance reference for RFC-0001 §3.3. Rejects NumPy-only calls that
    # numpy's own __array_namespace__ silently permits (it returns numpy
    # itself, so hasattr checks pass spuriously). BSD. Test-only.
    "array_api_strict>=2.6.1",
    # Still not a *runtime* dependency (see the default-closure note above):
    # the default closure stays empty and numpy is reachable only through the
    # `numpy` and `io` extras. The suite needs it because the eager backend
    # every user actually has is the one worth testing against, and because
    # RFC-0001 §11.2 requires `content_hash` to be checked on the buffer path
    # that `array_api_strict` cannot reach. By reference, so the floor is
    # raised in one place.
    "akriti[numpy]",
]
lint = [
    "ruff>=0.16.2",
    "mypy>=2.3.0",
]
dev = ["akriti[test,lint,rips,alpha,distances]"]

[project.urls]
Homepage = "https://akriti.io"
Source = "https://github.com/akritihq/akriti"
Issues = "https://github.com/akritihq/akriti/issues"
RFCs = "https://github.com/akritihq/akriti/tree/main/rfcs"

[tool.hatch.build.targets.wheel]
packages = ["src/akriti"]

[tool.hatch.build.targets.sdist]
include = ["src/akriti", "tests", "rfcs", "README.md", "LICENSE", "DEPENDENCIES.md"]

# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "backend: requires an optional persistence backend to be installed",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py310"
# ruff formats Python blocks inside Markdown, which collapses the aligned
# comments in the RFCs. Those are specification documents published for public
# comment; readability of the illustrative blocks wins over formatter
# consistency, and they are not executed.
extend-exclude = ["rfcs/**/*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RET", "SIM", "NPY", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# Capital single letters are the standard naming for data matrices and point
# clouds throughout scientific Python. Renaming them to satisfy PEP 8 would make
# the code harder to read for exactly the audience that reads it.
"rfcs/evidence/*" = ["N806"]
"src/akriti/**" = []

[tool.mypy]
python_version = "3.10"
files = ["src/akriti"]
strict = true
warn_unreachable = true
disallow_untyped_defs = true
# Optional backends are absent in the default environment by design.
[[tool.mypy.overrides]]
module = ["gudhi.*", "ripser.*", "persim.*", "gtda.*", "anndata.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/akriti"]
branch = true
